# Site settings (used by templates and by jekyll-seo-tag).
# Note: this file is not reloaded by `bundle exec jekyll serve`; restart after editing.
title: Josiah Couch
description: >-
  Theoretical physicist working on problems related to machine learning.
baseurl: ""
url: "https://josiahcouch.com"
logo: /assets/img/josiah_couch_headshot.webp
github:  iosialectus
linkedin: josiah-couch
googlescholar: IHCXIycAAAAJ
orcid: 0000-0002-7416-5858
inspirehep: 1491322

author: Josiah Couch
twitter:
  card: summary  # square preview, matches the square headshot image
social:
  name: Josiah Couch
  links:
    - https://www.linkedin.com/in/josiah-couch/
    - https://github.com/iosialectus
    - https://orcid.org/0000-0002-7416-5858
