# Build settings
markdown: kramdown
theme: null  # no theme; layouts live in _layouts
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  # Social preview image for every page (OpenGraph / Twitter card).
  - scope:
      path: ""
    values:
      image: /assets/img/josiah_couch_social.jpg
  # Keep talk slides and their figure files out of the sitemap;
  # the decks are still linked from the Research page.
  - scope:
      path: "assets/talks"
    values:
      sitemap: false
